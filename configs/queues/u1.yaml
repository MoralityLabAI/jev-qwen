# SPEC-U1 (docs/ubench/SPEC.md): comparator runs, then seeds 0, 1, 2 of J-multi and J-multi-loop.
name: u1
min_free_mib: 10000
min_free_commit_gb: 4
stable_seconds: 60
timeout_minutes: 900
retries: 2
keep_awake: true
steps:
  - name: j_v1_s1_u1
    args: [scripts/xbench.py, j, --arm, J-V1, --seed, "1", --suites, "s2,s7p"]
  - name: j_v1_s2_u1
    args: [scripts/xbench.py, j, --arm, J-V1, --seed, "2", --suites, "s2,s7p"]
  - name: train_multi_s0
    args: [scripts/train_adapter.py, --config, configs/train/multi_lora.yaml]
  - name: j_multi_s0
    args: [scripts/xbench.py, j, --arm, J-multi, --suites, "s1,s2,s4,s7,s7p,s3"]
  - name: train_multi_loop_s0
    args: [scripts/train_adapter.py, --config, configs/train/multi_loop.yaml]
  - name: j_multi_loop_s0
    args: [scripts/xbench.py, j, --arm, J-multi-loop, --suites, "s1,s2,s4,s7,s7p"]
  - name: train_multi_s1
    args: [scripts/train_adapter.py, --config, configs/train/multi_lora.yaml, --set, seed=1]
  - name: j_multi_s1
    args: [scripts/xbench.py, j, --arm, J-multi, --seed, "1", --suites, "s1,s2,s4,s7,s7p"]
  - name: train_multi_loop_s1
    args: [scripts/train_adapter.py, --config, configs/train/multi_loop.yaml, --set, seed=1]
  - name: j_multi_loop_s1
    args: [scripts/xbench.py, j, --arm, J-multi-loop, --seed, "1", --suites, "s1,s2,s4,s7,s7p"]
  - name: train_multi_s2
    args: [scripts/train_adapter.py, --config, configs/train/multi_lora.yaml, --set, seed=2]
  - name: j_multi_s2
    args: [scripts/xbench.py, j, --arm, J-multi, --seed, "2", --suites, "s1,s2,s4,s7,s7p"]
  - name: train_multi_loop_s2
    args: [scripts/train_adapter.py, --config, configs/train/multi_loop.yaml, --set, seed=2]
  - name: j_multi_loop_s2
    args: [scripts/xbench.py, j, --arm, J-multi-loop, --seed, "2", --suites, "s1,s2,s4,s7,s7p"]
