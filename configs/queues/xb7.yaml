# Addendum A3: S6 injection ladder on the seed-1 and seed-2 adapters of J-V1 and J-V2b, after xb6.
# Tests the seed-0 contrast behind H7's stronger form (V1 5 flips of 54, V2b-r2 0; p = 0.0625).
name: xb7
min_free_mib: 10000
min_free_commit_gb: 2
stable_seconds: 60
timeout_minutes: 900
retries: 2
keep_awake: true
steps:
  - name: wait_xb6
    args: [scripts/wait_queue.py, --queue, configs/queues/xb6.yaml, --timeout-minutes, "4000"]
  - name: j_v1_s1_s6
    args: [scripts/xbench.py, j, --arm, J-V1, --seed, "1", --suites, s6]
  - name: j_v2b_s1_s6
    args: [scripts/xbench.py, j, --arm, J-V2b, --seed, "1", --suites, s6]
  - name: j_v1_s2_s6
    args: [scripts/xbench.py, j, --arm, J-V1, --seed, "2", --suites, s6]
  - name: j_v2b_s2_s6
    args: [scripts/xbench.py, j, --arm, J-V2b, --seed, "2", --suites, s6]
