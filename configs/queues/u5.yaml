# SPEC-U5 (docs/ubench/SPEC-U5.md): proposals, reject paths, J-u4 training and evaluation.
name: u5
min_free_mib: 15000   # wait for an idle GPU (shared with other sessions and apps)
min_free_commit_gb: 4
stable_seconds: 60
timeout_minutes: 900
retries: 2
keep_awake: true
steps:
  - name: propose_j_v0
    args: [scripts/xbench.py, u5, propose, --proposer, J-V0]
  - name: propose_bonsai
    args: [scripts/xbench.py, u5, propose, --proposer, Bonsai-8B]
  - name: cpu_u5
    args: [scripts/xbench.py, u5, cpu]
  - name: train_u4_s0
    args: [scripts/train_adapter.py, --config, configs/train/u4_lora.yaml]
  - name: eval_u4_s0
    args: [scripts/xbench.py, u5, j, --arm, J-u4]
  - name: train_u4_s1
    args: [scripts/train_adapter.py, --config, configs/train/u4_lora.yaml, --set, seed=1]
  - name: eval_u4_s1
    args: [scripts/xbench.py, u5, j, --arm, J-u4, --seed, "1"]
  - name: train_u4_s2
    args: [scripts/train_adapter.py, --config, configs/train/u4_lora.yaml, --set, seed=2]
  - name: eval_u4_s2
    args: [scripts/xbench.py, u5, j, --arm, J-u4, --seed, "2"]
