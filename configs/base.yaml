# Defaults shared by every run. Variant files override `variant`, suite files fill `suite`,
# and `--set a.b=value` overrides anything. The fully resolved config is stored in each record.

model:
  id: Qwen/Qwen3.5-4B-Base
  revision: 1001bb4d826a52d1f399e183466143f4da7b741b   # Hub commit downloaded 2026-10-01
  dtype: bfloat16
  device: cuda
  cuda_memory_fraction: 0.70   # shared 16 GB card: fail with OOM past ~11.4 GB rather than spill
  load_in_4bit: false   # true = bitsandbytes NF4 (QLoRA-style); changes the baseline, record it

seed: 0

variant:
  name: unnamed
  driver: stock         # stock | schedule (see src/jevq/harness.py)
  loop: null            # {start, end, n_iters}; requires driver: schedule
  halting: null         # {kind: convergence, threshold}; V4 seam, off by default
  adapter: null         # V1; not wired yet

readout:
  modes: [choice, generate]   # also available: generate_cot (reasoning line, then the answer)
  n_shots: 4
  max_new_tokens: 16
  cot_max_new_tokens: 192   # longest reference trace + answer on dev is 142 tokens

instrument:
  enabled: true         # per-step rows for the schedule driver -> steps.jsonl
  record_layers: false  # also one row per layer application (large)
  logit_lens: true      # lens after each span iteration
  lens_mode: tail       # tail = through the remaining layers (exact early-exit output); direct = skip them

paths:
  results: results
  checkpoints: checkpoints
